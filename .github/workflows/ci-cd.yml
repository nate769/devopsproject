name: StockPile CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One pipeline per branch at a time; a newer push cancels an older PR run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # STAGE 1 — Quality gates: unit tests, frontend build, IaC validation
  # ==========================================================================
  test-backend:
    name: Test · Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run tests (fails the pipeline on any failing test)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build-frontend:
    name: Build · Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  validate-iac:
    name: Validate · Terraform + Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: terraform validate
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: terraform
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint helm/stockpile
          helm lint helm/stockpile -f helm/stockpile/values-prod.yaml
          helm template stockpile helm/stockpile -f helm/stockpile/values-prod.yaml > /dev/null

  # ==========================================================================
  # STAGE 2 — Build image → Trivy scan (gate) → push to GHCR, tagged with the commit SHA
  # ==========================================================================
  build-scan-push:
    name: Image · ${{ matrix.service }}
    needs: [test-backend, build-frontend, validate-iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; GitHub usernames may not be.
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/stockpile-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true          # keep it local so Trivy can scan it before anything is pushed
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # trivy-action 0.35.0 + Trivy v0.69.3 are the known-clean releases after the
      # March 2026 supply-chain compromise (GHSA-69fq-xp46-6x23 / CVE-2026-33634).
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (SHA tag only — no mutable "latest")
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

  # ==========================================================================
  # STAGE 3 — GitOps deploy: commit the new tag; ArgoCD syncs it to EKS
  # ==========================================================================
  gitops-update:
    name: Deploy · bump image tag for ArgoCD
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Update helm/stockpile/values-prod.yaml
        env:
          TAG: ${{ github.sha }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export BACKEND_REPO="${REGISTRY}/${OWNER}/stockpile-backend"
          export FRONTEND_REPO="${REGISTRY}/${OWNER}/stockpile-frontend"
          yq -i '
            .backend.image.repository = strenv(BACKEND_REPO) |
            .backend.image.tag = strenv(TAG) |
            .frontend.image.repository = strenv(FRONTEND_REPO) |
            .frontend.image.tag = strenv(TAG)
          ' helm/stockpile/values-prod.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/stockpile/values-prod.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "deploy: stockpile ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
