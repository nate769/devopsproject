apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpile.backendName" . }}
  labels:
    {{- include "stockpile.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "stockpile.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http          # the ServiceMonitor scrapes this named port
      port: {{ .Values.backend.port }}
      targetPort: http
