apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpile.postgresName" . }}
  labels:
    {{- include "stockpile.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
