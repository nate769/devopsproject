apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpile.backendName" . }}
  labels:
    {{- include "stockpile.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "stockpile.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "stockpile.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 1000      # "node" user in the node:alpine image
      initContainers:
        # Avoid a crash loop on first install while PostgreSQL is still initialising.
        # (-U is required: uid 1000 has no passwd entry in this image, so there is no default user.)
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "stockpile.postgresName" . }} -p 5432 -U {{ .Values.postgres.username }}; do echo waiting for postgres; sleep 2; done
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
            - name: SEED_SAMPLE_DATA
              value: {{ .Values.backend.seedSampleData | quote }}
            - name: PGHOST
              value: {{ include "stockpile.postgresName" . }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ include "stockpile.postgresName" . }}, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "stockpile.postgresName" . }}, key: password } }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Liveness = "is the process alive?"  Readiness = "can it reach the database right now?"
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
