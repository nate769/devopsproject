{{- if .Values.networkPolicy.enabled }}
# Defence in depth: only backend pods may open connections to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stockpile.postgresName" . }}
  labels:
    {{- include "stockpile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stockpile.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "stockpile.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
